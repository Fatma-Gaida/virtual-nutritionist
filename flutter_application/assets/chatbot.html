<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #chatbot-container { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="chatbot-container"></div>
  
  <script>
    (function() {
      function loadChatbase() {
        const script = document.createElement('script');
        script.src = 'https://www.chatbase.co/embed.min.js';
        script.id = 'a_t4Hm6RM6VVtTkPm9DFX';
        script.setAttribute('data-chatbot-id', 'YOUR_CHATBOT_ID');
        script.setAttribute('data-domain', 'www.chatbase.co');
        script.onerror = function() {
          console.error('Chatbase failed to load');
          if (window.flutter_inappwebview) {
            window.flutter_inappwebview.callHandler('chatbaseError');
          }
        };
        document.body.appendChild(script);
      }
      
      if (document.readyState === 'complete') {
        loadChatbase();
      } else {
        window.addEventListener('load', loadChatbase);
      }
    })();
  </script>
</body>
</html>
